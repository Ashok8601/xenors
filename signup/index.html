<div class="signup-card" id="main-content">
<div class="logo-area">
<img alt="Xenors Logo" decoding="async" loading="lazy" src="/images/xenors.png"/>

<h2>Join Xenors</h2>
<p>Empower your journey in Tech &amp; AI.</p>
<div class="input-group">
<label for="fullName">Full Name</label>
<input id="fullName" placeholder="Enter your full name" required="" type="text"/>
</div>
<div class="input-group">
<label for="email">Email Address</label>
<input id="email" placeholder="name@example.com" required="" type="email"/>
</div>
<div class="input-group">
<label for="password">Password</label>
<input id="password" placeholder="Create a strong password" required="" type="password"/>
<div class="strength-bar"></div>
</div>
<button class="signup-btn" id="signupBtn" onclick="signUp()">Create Account</button>
<div id="status-msg"></div>
<div class="footer-links">
        Already have an account? <a href="/login/">Sign In</a><br/><br/>
        By signing up, you agree to our <a href="/terms/">Terms</a> &amp; <a href="/privacy-policy/">Privacy Policy</a>
</div>
</div>
<script>
    // Supabase Configuration
    const supabaseClient = supabase.createClient(
        "https://fejvrvzllmvizdvnwopk.supabase.co",
        "sb_publishable_RIQQVfP2XVPV0woSF10isQ_kdvM21kV"
    );

    async function signUp() {
        const fullName = document.getElementById("fullName").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const statusMsg = document.getElementById("status-msg");
        const btn = document.getElementById("signupBtn");

        if (!fullName || !email || !password) {
            statusMsg.style.color = "#ff4d4d";
            statusMsg.innerText = "Please fill in all the details.";
            return;
        }

        if (password.length < 6) {
            statusMsg.style.color = "#ff4d4d";
            statusMsg.innerText = "Password must be at least 6 characters.";
            return;
        }

        // Loading state
        btn.innerText = "Creating Account...";
        btn.disabled = true;

        const { data, error } = await supabaseClient.auth.signUp({
            email: email,
            password: password,
            options: {
                data: {
                    full_name: fullName // Saving name in User Metadata
                }
            }
        });

        if (error) {
            statusMsg.style.color = "#ff4d4d";
            statusMsg.innerText = error.message;
            btn.innerText = "Create Account";
            btn.disabled = false;
        } else {
            statusMsg.style.color = "#00ff88";
            statusMsg.innerText = "Registration successful! Please check your email or Login.";
            
            setTimeout(() => {
                window.location.href = "login.html";
            }, 2000);
        }
    }
</script>
