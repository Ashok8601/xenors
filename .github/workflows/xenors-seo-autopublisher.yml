name: Xenors SEO Autopublisher

on:
  schedule:
    # GitHub cron is UTC. 04:30 UTC = 10:00 IST, 12:30 UTC = 18:00 IST.
    - cron: "30 4 * * *"
    - cron: "30 12 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate and validate without committing"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: xenors-seo-autopublisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-6-luna' }}
      XENORS_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Stop after six-month window
        id: window
        shell: bash
        run: |
          today="$(date -u +%F)"
          if [[ "$today" > "2027-05-12" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Publishing window ended on 2027-05-12."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.window.outputs.enabled == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install autopublisher dependencies
        if: steps.window.outputs.enabled == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install "openai>=2,<4" "Pillow>=10.4,<13" beautifulsoup4==4.12.3 soupsieve==2.6

      - name: Require OpenAI API key
        if: steps.window.outputs.enabled == 'true'
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Missing repository secret OPENAI_API_KEY"
            exit 1
          fi

      - name: Generate one unique SEO article
        if: steps.window.outputs.enabled == 'true'
        run: python scripts/xenors_autopublish.py

      - name: Build and validate site
        if: steps.window.outputs.enabled == 'true'
        run: python build.py

      - name: Commit generated article
        if: steps.window.outputs.enabled == 'true' && env.XENORS_DRY_RUN != 'true'
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "::error::Autopublisher produced no repository changes."
            exit 1
          fi
          git config user.name "xenors-seo-bot"
          git config user.email "xenors-seo-bot@users.noreply.github.com"
          git add ai tech plc coding data-science machine-learning images .github/xenors_publish_state.json
          git diff --cached --stat
          git commit -m "Publish scheduled Xenors SEO article"
          git push origin HEAD:main

      - name: Print published URL
        if: steps.window.outputs.enabled == 'true'
        shell: bash
        run: |
          if [ -f .github/xenors_publish_state.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          p=Path(".github/xenors_publish_state.json")
          d=json.loads(p.read_text())
          print("Published URL:", d.get("last_url"))
          print("Title:", d.get("last_title"))
          print("Slot:", d.get("last_slot"))
          PY
          fi
