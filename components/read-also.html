<section class="xenors-read-also read-also" data-xenors-build="read-also" aria-labelledby="xenors-related-title">
  <div class="xenors-read-also-head">
    <div>
      <p class="xenors-read-also-kicker">Continue exploring</p>
      <h2 id="xenors-related-title">Read Also</h2>
    </div>
    <p class="xenors-related-count">{{TOTAL_RELATED}} related pages</p>
  </div>

  <div class="xenors-related-grid" data-related-grid>
    {{RELATED_CARDS}}
  </div>

  <div class="xenors-read-also-actions">
    <button class="xenors-view-more" type="button" data-view-more data-batch-size="10" aria-expanded="false" {{VIEW_MORE_HIDDEN}}>
      View More
    </button>
  </div>
</section>
