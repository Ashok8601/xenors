<div class="login-card" id="main-content">

<h2>Welcome Back</h2>

<div class="input-group">
<label for="email">Email Address</label>
<input id="email" placeholder="Enter your email" required="" type="email"/>
</div>
<div class="input-group">
<label for="password">Password</label>
<input id="password" placeholder="Enter password" required="" type="password"/>
</div>
<button class="login-btn" id="loginBtn" onclick="login()">Sign In</button>

<script>
    // Supabase Configuration
    const supabaseClient = supabase.createClient(
        "https://fejvrvzllmvizdvnwopk.supabase.co",
        "sb_publishable_RIQQVfP2XVPV0woSF10isQ_kdvM21kV"
    );

    async function login() {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const statusMsg = document.getElementById("status-msg");
        const btn = document.getElementById("loginBtn");

        if (!email || !password) {
            statusMsg.style.color = "#ff4d4d";
            statusMsg.innerText = "Please fill in all fields.";
            return;
        }

        // Loading State
        btn.innerText = "Authenticating...";
        btn.disabled = true;

        const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });

        if (error) {
            statusMsg.style.color = "#ff4d4d";
            statusMsg.innerText = error.message;
            btn.innerText = "Sign In";
            btn.disabled = false;
        } else {
            statusMsg.style.color = "#00ff88";
            statusMsg.innerText = "Login successful! Redirecting...";
            
            // Success: Redirect to dashboard or home
            setTimeout(() => {
                window.location.href = "/"; 
            }, 1000);
        }
    }
</script>
