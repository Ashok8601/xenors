services:
- type: web
  name: xenors
  runtime: static
  buildCommand: pip install -r requirements.txt && python build.py && python validate_site.py
  staticPublishPath: .
  headers:
  - path: /*
    name: X-Content-Type-Options
    value: nosniff
  - path: /*
    name: Referrer-Policy
    value: strict-origin-when-cross-origin
  - path: /*
    name: X-Frame-Options
    value: SAMEORIGIN
  - path: /images/*
    name: Cache-Control
    value: public, max-age=604800
  routes:
